<span class="font-h2 text-h2 font-bold text-primary dark:text-primary-fixed">Plumbly</span>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">

<div class="relative mb-stack-md">
<div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-primary to-primary-container shadow-lg">
<img alt="Alex Johnson" class="w-full h-full object-cover rounded-full border-2 border-surface" data-alt="A close-up, high-resolution portrait of a smiling professional man with short dark hair and a groomed beard. He is wearing a simple, high-quality white t-shirt. The background is a minimalist, brightly lit studio setting with soft shadows, perfectly matching the premium minimalist aesthetic of a high-end service platform. The mood is welcoming and reliable." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0qHn6Se9JsrQUaVDHUcn63meVpbukP0AKgWNHrAYqu7eTubi02vMWcCofQmgp-7F08tUvDh9Pz4f5-01RZINRnRHrsmCqYwmr1IdBdLegoIPlD6QfJMC7H30IrifX19nqCee2fhUV3ggb7uZaPN8HugKGUzYIpFFfwAEWDrznKPNiBIitNDbdkZx_7gx94zn6n-cQN49QeMSKw-HyrdlLM-561sk7IP9Ia23SdjQBTBqDMj-OfDPbc2X-DOXflXugAySUGUmRZFFK"/>

</div>
</div>
<div class="text-center">
<h1 class="font-h2 text-h2 text-on-surface">Alex Johnson</h1>
<p class="font-body-sm text-body-sm text-secondary">Verified Premium Member • 4.9 Rating</p>
</div>
</section>
<!-- Stats Bento Grid (Visual Interest) -->
<div class="grid grid-cols-2 gap-gutter-grid mb-stack-lg">
<div class="bg-surface-container-low p-stack-md rounded-xl border border-outline-variant/30">
<p class="font-label-sm text-label-sm text-secondary mb-1">Total Savings</p>
<p class="font-h3 text-h3 text-primary">$124.50</p>
</div>
<div class="bg-surface-container-low p-stack-md rounded-xl border border-outline-variant/30">
<p class="font-label-sm text-label-sm text-secondary mb-1">Member Since</p>
<p class="font-h3 text-h3 text-on-surface">Oct 2023</p>
</div>
</div>
<!-- Menu List -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/20 overflow-hidden">
<!-- Past Bookings -->
<button class="w-full flex items-center justify-between p-stack-md hover:bg-surface-container-high transition-colors active:scale-[0.98] duration-150 border-b border-outline-variant/10">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-primary-container/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="history">history</span>
</div>
<div class="text-left">
<p class="font-body-md text-body-md font-semibold text-on-surface">Past Bookings</p>

</div>
</div>
<span class="material-symbols-outlined text-secondary opacity-50">chevron_right</span>
</button>
<!-- Saved Addresses -->

<div class="w-10 h-10 rounded-lg bg-primary-container/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="home_pin">home_pin</span>
</div>
<div class="text-left">
<p class="font-body-md text-body-md font-semibold text-on-surface">Saved Addresses</p>
<p class="font-label-sm text-label-sm text-secondary">Manage your locations</p>
</div>
</div>
<span class="material-symbols-outlined text-secondary opacity-50">chevron_right</span>
</button>

<div class="w-10 h-10 rounded-lg bg-primary-container/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
</div>
<div class="text-left">
<p class="font-body-md text-body-md font-semibold text-on-surface">Payment Methods</p>

</div>
</div>
<span class="material-symbols-outlined text-secondary opacity-50">chevron_right</span>
</button>

<div class="w-10 h-10 rounded-lg bg-primary-container/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</div>
<div class="text-left">
<p class="font-body-md text-body-md font-semibold text-on-surface">Settings</p>

</div>
</div>
<span class="material-symbols-outlined text-secondary opacity-50">chevron_right</span>
</button>
</div>

<button class="w-full flex items-center justify-center gap-2 py-4 px-6 rounded-xl border border-error/20 text-error font-body-md font-semibold bg-error/5 hover:bg-error/10 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
                Log out
            </button>
<p class="text-center mt-stack-md font-label-sm text-label-sm text-secondary opacity-60">Version 2.4.1 (Build 890)</p>
</div>

<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed hover:text-primary transition-all active:scale-90 duration-200" href="#">

<span class="font-label-sm text-label-sm">Bookings</span>
